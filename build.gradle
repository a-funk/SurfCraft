plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"surfcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Game tests live in their own source set and mod (src/gametest), so they never ship in the mod jar.
// runGameTest (server tests, part of check/build) and runClientGameTest (opens a client window, run on demand).
fabricApi {
	configureTests {
		createSourceSet = true
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

loom.runs.named("gameTest") {
	vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest/server-tests.xml').get().asFile}"
}

loom.runs.named("clientGameTest") {
	// Loom clears the client run directory before launches, so screenshots go next to the server report.
	vmArg "-Dsurfcraft.screenshots=${layout.buildDirectory.dir('gametest/screenshots').get().asFile}"
	// ./gradlew runClientGameTest -PclientTests=surf,server runs only those client tests (default: all).
	vmArg "-Dsurfcraft.clientTests=${providers.gradleProperty('clientTests').getOrElse('')}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// The Kitsune replays read the user's own map geometry from the gitignored local-content/ and skip without it:
	// declare it, so extracting or re-extracting it reruns them instead of reusing a skipped result.
	inputs.files(fileTree("local-content/css-reference")).withPropertyName("kitsuneGeometry").optional()
}

jar {
	// The MIT license, the acknowledgements and Valve's license texts travel with the mod.
	from("LICENSE") { into "META-INF" }
	from("THIRD_PARTY_NOTICES.md") { into "META-INF" }
	from("LICENSES") { into "META-INF/licenses" }
}
