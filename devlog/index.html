<header><h1>Surf<span>Craft</span> dev log</h1><p>CS:S surf ramps and surf physics for Minecraft 26.3, built step by step. Work in progress; updated 2026-10-01 04:08.</p></header>
<main>
<figure><a href="shots/01-picking-the-ramp-angles-from-real-surf-maps.jpg"><img src="shots/01-picking-the-ramp-angles-from-real-surf-maps.jpg" loading="lazy" alt="Picking the ramp angles from real surf maps"></a><figcaption><span class="n">01</span> <b>Picking the ramp angles from real surf maps</b><span class="at">2026-10-01 01:30</span><p>Every surf face in 41 local KSF maps: 51 degrees is by far the most common, so Surf Ramp uses a 5:4 slope (51.3 degrees); Steep Surf Ramp uses 2:1 (63.4 degrees). A 1x1 45-degree wedge would be walkable ground in Source, not a surf ramp.</p></figcaption></figure>
<figure><a href="shots/02-how-blocks-join-into-one-ramp.jpg"><img src="shots/02-how-blocks-join-into-one-ramp.jpg" loading="lazy" alt="How blocks join into one ramp"></a><figcaption><span class="n">02</span> <b>How blocks join into one ramp</b><span class="at">2026-10-01 01:30</span><p>Each ramp block stores its cut of a shared plane, so blocks placed next to each other continue the same slope at any size. The geometry (RampCell) is tested for exact plane continuity across neighbours.</p></figcaption></figure>
<figure><a href="shots/03-first-ramp-textures.jpg"><img src="shots/03-first-ramp-textures.jpg" loading="lazy" alt="First ramp textures"></a><figcaption><span class="n">03</span> <b>First ramp textures</b><span class="at">2026-10-01 01:31</span><p>The blocks agent drew two 16x16 textures in code (no fal key): cool teal for the 51-degree Surf Ramp, amber for the 63-degree Steep Surf Ramp, with a lit top/left edge to fit Minecraft&#x27;s pixel style.</p></figcaption></figure>
<figure><a href="shots/04-first-in-game-render.jpg"><img src="shots/04-first-in-game-render.jpg" loading="lazy" alt="First in-game render"></a><figcaption><span class="n">04</span> <b>First in-game render</b><span class="at">2026-10-01 01:38</span><p>The client game test builds a showcase in a superflat world: a joined 51-degree Surf Ramp (teal) backed by a 63-degree Steep Surf Ramp (amber), plus single blocks of each in all four facings. Slopes render as exact geometry, not stair steps.</p></figcaption></figure>
<figure><a href="shots/05-smooth-slope-up-close-items-in-the-hotbar.jpg"><img src="shots/05-smooth-slope-up-close-items-in-the-hotbar.jpg" loading="lazy" alt="Smooth slope up close, items in the hotbar"></a><figcaption><span class="n">05</span> <b>Smooth slope up close, items in the hotbar</b><span class="at">2026-10-01 01:38</span><p>Up close, the blocks join into one continuous slope with the texture lined up across cells. The hotbar shows both ramp items as wedges.</p></figcaption></figure>
<figure><a href="shots/06-java-physics-vs-the-real-cs-s-server.jpg"><img src="shots/06-java-physics-vs-the-real-cs-s-server.jpg" loading="lazy" alt="Java physics vs the real CS:S server"></a><figcaption><span class="n">06</span> <b>Java physics vs the real CS:S server</b><span class="at">2026-10-01 01:56</span><p>The physics port replays a recording from a real Counter-Strike: Source server on surf_kitsune&#x27;s ramp: same inputs, same ramp, worst difference 0.006 units over 100 ticks (tolerance 0.05). 18 engine recordings pass this way.</p></figcaption></figure>
<figure><a href="shots/07-the-63-degree-steep-surf-ramp.jpg"><img src="shots/07-the-63-degree-steep-surf-ramp.jpg" loading="lazy" alt="The 63-degree Steep Surf Ramp"></a><figcaption><span class="n">07</span> <b>The 63-degree Steep Surf Ramp</b><span class="at">2026-10-01 01:56</span><p>The 2:1 side of the showcase: eight blocks long and six tall, one smooth plane with a continuous grid.</p></figcaption></figure>
<figure><a href="shots/08-one-block-of-each-type-in-every-facing.jpg"><img src="shots/08-one-block-of-each-type-in-every-facing.jpg" loading="lazy" alt="One block of each type, in every facing"></a><figcaption><span class="n">08</span> <b>One block of each type, in every facing</b><span class="at">2026-10-01 01:56</span><p>Single ramp blocks facing north, east, south and west. Behind them, the cross-section of the joined showcase: a 51-degree side and a 63-degree side meeting at the ridge.</p></figcaption></figure>
<figure><a href="shots/09-first-surf-in-game.jpg"><img src="shots/09-first-surf-in-game.jpg" loading="lazy" alt="First surf in game"></a><figcaption><span class="n">09</span> <b>First surf in game</b><span class="at">2026-10-01 02:36</span><p>The CS:S movement core now drives the player in Minecraft: dropped onto a 51-degree ramp at 788 units/s while holding the strafe key into the slope, the player glides along it. The speedometer above the hotbar shows horizontal speed in units/s.</p></figcaption></figure>
<figure><a href="shots/10-the-karambit.jpg"><img src="shots/10-the-karambit.jpg" loading="lazy" alt="The Karambit"></a><figcaption><span class="n">10</span> <b>The Karambit</b><span class="at">2026-10-01 03:00</span><p>SurfCraft&#x27;s surf-building tool: a 16x16 CS:GO-style karambit drawn in code, with a claw blade in a Fade finish (gold, purple, pink), a black grip and a finger ring. Zoomed, at 1x to 8x, and in hand next to the hotbar.</p></figcaption></figure>
<figure><a href="shots/11-getting-the-sprite-to-read-as-a-karambit.jpg"><img src="shots/11-getting-the-sprite-to-read-as-a-karambit.jpg" loading="lazy" alt="Getting the sprite to read as a karambit"></a><figcaption><span class="n">11</span> <b>Getting the sprite to read as a karambit</b><span class="at">2026-10-01 03:00</span><p>Before and after: the first tries drew a flat arc with a 1-pixel ring. The final sprite has a hooked claw blade with a dark outline (like vanilla swords) and a ring with a clear hole.</p></figcaption></figure>
<figure><a href="shots/12-copy-a-ramp-chunk-extend-it-three-times.jpg"><img src="shots/12-copy-a-ramp-chunk-extend-it-three-times.jpg" loading="lazy" alt="Copy a ramp chunk, extend it three times"></a><figcaption><span class="n">12</span> <b>Copy a ramp chunk, extend it three times</b><span class="at">2026-10-01 03:00</span><p>Sneak + right-click copies a hand-built 63-degree chunk (6x6x4, 96 blocks) onto the knife. Three right-clicks on the ramp put a copy after its end each time: 16 blocks long, every cell on the same slope plane.</p></figcaption></figure>
<figure><a href="shots/13-the-default-module-a-two-sided-surf-ramp.jpg"><img src="shots/13-the-default-module-a-two-sided-surf-ramp.jpg" loading="lazy" alt="The default module: a two-sided surf ramp"></a><figcaption><span class="n">13</span> <b>The default module: a two-sided surf ramp</b><span class="at">2026-10-01 03:00</span><p>A fresh knife places the classic two-sided 51-degree ramp in one click: Surf Ramp 5:4 on both sides of a ridge, 8 wide, 5 tall, 8 long (224 blocks), cut with the ramp plane formula.</p></figcaption></figure>
<figure><a href="shots/14-placement-preview-green-fits-red-is-blocked.jpg"><img src="shots/14-placement-preview-green-fits-red-is-blocked.jpg" loading="lazy" alt="Placement preview: green fits, red is blocked"></a><figcaption><span class="n">14</span> <b>Placement preview: green fits, red is blocked</b><span class="at">2026-10-01 03:00</span><p>Holding the knife outlines the box a click would fill, using the server&#x27;s own placement code: green when it fits, red with the blocked cells outlined, and at a ramp&#x27;s end the next extension.</p></figcaption></figure>
<figure><a href="shots/15-all-or-nothing.jpg"><img src="shots/15-all-or-nothing.jpg" loading="lazy" alt="All or nothing"></a><figcaption><span class="n">15</span> <b>All or nothing</b><span class="at">2026-10-01 03:00</span><p>Clicking where it doesn&#x27;t fit places nothing: the action bar gives the reason and red dust marks the 44 cells in the way. In survival the knife also takes one item per block, or lists what&#x27;s missing; sneak + right-click in the air undoes.</p></figcaption></figure>
<figure><a href="shots/16-the-knife-remembers-its-module.jpg"><img src="shots/16-the-knife-remembers-its-module.jpg" loading="lazy" alt="The knife remembers its module"></a><figcaption><span class="n">16</span> <b>The knife remembers its module</b><span class="at">2026-10-01 03:00</span><p>The copied module is stored on the item (palette plus run-length encoded blocks), so it survives restarts; the tooltip shows its size and the controls.</p></figcaption></figure>
<figure><a href="shots/17-surfing-in-third-person.jpg"><img src="shots/17-surfing-in-third-person.jpg" loading="lazy" alt="Surfing in third person"></a><figcaption><span class="n">17</span> <b>Surfing in third person</b><span class="at">2026-10-01 03:09</span><p>Third-person view of a survival surf run on the 51-degree ramp at 724 units/s. The legs stay still while sliding instead of running in place, the speedometer reads horizontal speed, and the server accepted every move without a single correction.</p></figcaption></figure>
<figure><a href="shots/18-2200-units-s-on-a-dedicated-server.jpg"><img src="shots/18-2200-units-s-on-a-dedicated-server.jpg" loading="lazy" alt="2200 units/s on a dedicated server"></a><figcaption><span class="n">18</span> <b>2200 units/s on a dedicated server</b><span class="at">2026-10-01 03:43</span><p>The same surf run against a real dedicated server over the network, in survival, on the 63-degree ramp at 2200 units/s. 254 blocks along the ramp, plus four fast crossings over an apex: the server corrected nothing and logged no &#x27;moved wrongly&#x27;.</p></figcaption></figure>
<figure><a href="shots/19-minecraft-adds-nothing-to-the-physics.jpg"><img src="shots/19-minecraft-adds-nothing-to-the-physics.jpg" loading="lazy" alt="Minecraft adds nothing to the physics"></a><figcaption><span class="n">19</span> <b>Minecraft adds nothing to the physics</b><span class="at">2026-10-01 03:43</span><p>Speed every tick of two in-game surf runs (blue) against an offline replay of the same keys and mouse through the physics core alone (orange, dashed). Positions agree exactly, bit for bit: the Minecraft pipeline changes nothing about the CS:S movement.</p></figcaption></figure>
<figure><a href="shots/20-bug-fixed-sinking-through-a-ramp.jpg"><img src="shots/20-bug-fixed-sinking-through-a-ramp.jpg" loading="lazy" alt="Bug fixed: sinking through a ramp"></a><figcaption><span class="n">20</span> <b>Bug fixed: sinking through a ramp</b><span class="at">2026-10-01 03:45</span><p>Found by the in-game test: a creative player flying into a slope could sink through it a hair per tick, because the exact collision stopped boxes a rounding tolerance inside. Now boxes stop where they touch: 3000 presses into the slope, zero penetration.</p></figcaption></figure>
<figure><a href="shots/21-a-real-mod-icon.jpg"><img src="shots/21-a-real-mod-icon.jpg" loading="lazy" alt="A real mod icon"></a><figcaption><span class="n">21</span> <b>A real mod icon</b><span class="at">2026-10-01 04:08</span><p>The Fabric placeholder icon is replaced with SurfCraft&#x27;s own: a surf ramp in 3/4 view with the Karambit, drawn in code as 32x32 pixel art.</p></figcaption></figure>
</main></body></html>
